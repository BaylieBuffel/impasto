# Sourced after mkinitcpio.conf, so it edits the HOOKS already there: plymouth
# right after udev or systemd, which keeps it ahead of encrypt and sd-encrypt.
# Nothing changes until plymouth is installed.
if [[ -e /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *' plymouth '* ]]; then
    for i in "${!HOOKS[@]}"; do
        if [[ ${HOOKS[i]} == udev || ${HOOKS[i]} == systemd ]]; then
            HOOKS=("${HOOKS[@]:0:i+1}" plymouth "${HOOKS[@]:i+1}")
            break
        fi
    done
    unset i
fi
